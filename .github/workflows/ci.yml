name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate, test, build, and scan
        run: make ci

  nix:
    name: Nix development shell
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      - name: Lock and validate development shell
        run: |
          nix flake lock
          cat flake.lock
          nix flake check --no-build
          nix develop -c make ci

  integration:
    name: Incus integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and initialize disposable Incus
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            incus incus-client incus-agent dnsmasq-base qemu-system-x86 qemu-system-modules-spice qemu-utils ovmf virtiofsd
          sudo modprobe vhost_vsock
          test -c /dev/kvm
          sudo systemctl start incus
          sudo incus admin waitready --timeout=60
          sudo incus admin init --minimal
          sudo incus version
      - name: Import local stopped-VM fixture
        run: |
          mkdir -p "$RUNNER_TEMP/garden-image"
          cat > "$RUNNER_TEMP/garden-image/metadata.yaml" <<'EOF'
          architecture: x86_64
          creation_date: 1
          properties:
            description: Garden CI blank disk; stopped-VM tests only
          EOF
          qemu-img create -f qcow2 "$RUNNER_TEMP/garden-image/rootfs.img" 1G
          tar -C "$RUNNER_TEMP/garden-image" -cf "$RUNNER_TEMP/garden-image.tar" metadata.yaml rootfs.img
          sudo incus image import "$RUNNER_TEMP/garden-image.tar" --alias garden-ci-seed
          fingerprint=$(sha256sum "$RUNNER_TEMP/garden-image.tar" | cut -d ' ' -f 1)
          echo "GARDEN_TEST_INCUS_IMAGE=$fingerprint" >> "$GITHUB_ENV"
      - name: Fetch bootable restart-test image
        run: |
          sudo incus image copy images:alpine/3.22 local: --vm --alias garden-ci-boot
          fingerprint=$(sudo incus image list garden-ci-boot --format=json | jq -er '.[0].fingerprint')
          echo "GARDEN_TEST_INCUS_BOOT_IMAGE=$fingerprint" >> "$GITHUB_ENV"
          echo "Restart-test image: $fingerprint"
      - name: Compile integration tests
        run: |
          mkdir -p bin/integration
          go vet -tags integration ./...
          go test -c -tags integration -race -o bin/integration/ ./internal/incusconn ./internal/cli
      - name: Test against runner-local Incus
        run: |
          sudo env GARDEN_TEST_INCUS_SOCKET=/var/lib/incus/unix.socket \
            ./bin/integration/incusconn.test -test.v -test.run Integration -test.timeout=3m
          sudo env GARDEN_TEST_INCUS_SOCKET=/var/lib/incus/unix.socket \
            GARDEN_TEST_INCUS_IMAGE="$GARDEN_TEST_INCUS_IMAGE" \
            GARDEN_TEST_INCUS_BOOT_IMAGE="$GARDEN_TEST_INCUS_BOOT_IMAGE" \
            ./bin/integration/cli.test -test.v -test.run Integration -test.timeout=9m
      - name: Incus diagnostics
        if: failure()
        run: |
          sudo systemctl status incus --no-pager || true
          sudo journalctl -u incus -u incus.socket --no-pager -n 200 || true
