name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate, test, build, and scan
        run: make ci

  integration:
    name: Incus integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install and initialize disposable Incus
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends incus incus-client
          sudo systemctl start incus
          sudo incus admin waitready --timeout=60
          sudo incus admin init --minimal
          sudo incus version
      - name: Compile integration tests
        run: |
          mkdir -p bin
          go test -c -tags integration -race -o bin/incusconn-integration.test ./internal/incusconn
      - name: Test against runner-local Incus
        run: |
          sudo env GARDEN_TEST_INCUS_SOCKET=/var/lib/incus/unix.socket \
            ./bin/incusconn-integration.test -test.v -test.timeout=2m
      - name: Incus diagnostics
        if: failure()
        run: |
          sudo systemctl status incus --no-pager || true
          sudo journalctl -u incus -u incus.socket --no-pager -n 200 || true
